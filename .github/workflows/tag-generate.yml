name: Generate Tag on Branch Push

on:
  push:
    branches:
      - qa
      - main
    paths-ignore:
      - '.github/**'
      - 'README.md'

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}  # Use PAT instead of GITHUB_TOKEN
          persist-credentials: true

      - name: Calculate next tag
        id: tag
        run: |
          git fetch --tags --force
          
          # Get the latest semver tag
          latestTag=$(git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          
          if [ -z "$latestTag" ]; then
            echo "No initial tag found, creating 1.0.0"
            newTag="1.0.0"
          else
            echo "Latest tag: $latestTag"
            # Increment minor version, reset patch to 0
            IFS='.' read -r major minor patch <<< "$latestTag"
            new_minor=$((minor + 1))
            newTag="${major}.${new_minor}.0"
            echo "New tag: $newTag"
          fi
          
          echo "new_tag=$newTag" >> $GITHUB_OUTPUT
          echo "Generated tag: $newTag"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create the tag
          git tag -a ${{ steps.tag.outputs.new_tag }} -m "Release ${{ steps.tag.outputs.new_tag }}"
          
          # Push using PAT
          git push origin ${{ steps.tag.outputs.new_tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          
      - name: Create GitHub Release
        if: success()
        run: |
          gh release create ${{ steps.tag.outputs.new_tag }} \
            --title "Release ${{ steps.tag.outputs.new_tag }}" \
            --notes "Automated release from branch ${{ github.ref_name }}" \
            --target ${{ github.sha }}
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
